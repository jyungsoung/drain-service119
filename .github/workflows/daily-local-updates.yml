name: Daily Local Updates (frozen)

# Regional SEO expansion is intentionally frozen.
# Existing public pages and generated-cases.json remain untouched.
# This workflow can be opened manually for audit visibility, but it performs no generation,
# commit, push, sitemap expansion, or production publishing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm regional SEO freeze
        run: |
          echo "Regional SEO auto-generation is frozen."
          echo "Existing public URLs remain unchanged."
          echo "No generated-cases.json write, commit, push, sitemap expansion, or Netlify publish is performed by this workflow."
