name: Verify WordPress Secrets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-wp-auth-and-kboard.mjs'
      - '.github/workflows/verify-wordpress-secrets.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify WordPress authentication and KBoard boards
        env:
          DRAIN119_WP_BASE: https://drain119.co.kr
          DRAIN119_WP_USER: ${{ secrets.DRAIN119_WP_USER }}
          DRAIN119_WP_APP_PASSWORD: ${{ secrets.DRAIN119_WP_APP_PASSWORD }}
          WP_VERIFY_OUT_DIR: ${{ runner.temp }}/wp-verify
        run: node scripts/verify-wp-auth-and-kboard.mjs

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-kboard-verify-${{ github.run_number }}
          path: ${{ runner.temp }}/wp-verify/
          if-no-files-found: warn
          retention-days: 7
