name: WordPress Capability Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/wordpress-capability-check.mjs'
      - '.github/workflows/wordpress-capability-check.yml'
      - 'WORDPRESS_AUTOMATION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe WordPress and KBoard capabilities
        env:
          DRAIN119_WP_BASE: https://drain119.co.kr
          DRAIN119_WP_USER: ${{ secrets.DRAIN119_WP_USER }}
          DRAIN119_WP_APP_PASSWORD: ${{ secrets.DRAIN119_WP_APP_PASSWORD }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wordpress-capability"
          WP_CAPABILITY_OUT_DIR="$RUNNER_TEMP/wordpress-capability" node scripts/wordpress-capability-check.mjs

      - name: Upload capability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-capability-${{ github.run_number }}
          path: ${{ runner.temp }}/wordpress-capability/
          if-no-files-found: warn
          retention-days: 30
